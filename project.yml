name: FarFlow
options:
  bundleIdPrefix: com.faraz.farflow
  deploymentTarget:
    macOS: '26.0'
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: '5.0'
    MACOSX_DEPLOYMENT_TARGET: '26.0'
    ARCHS: arm64
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: '-'
    ENABLE_HARDENED_RUNTIME: YES
    SWIFT_STRICT_CONCURRENCY: targeted
packages:
  FluidAudio:
    url: https://github.com/FluidInference/FluidAudio.git
    revision: 1b0ed50d686873128a4129b3510ce3914c849bab
  MLXLanguageModels:
    url: https://github.com/ml-explore/mlx-swift-lm.git
    exactVersion: 2.29.3
  WhisperKit:
    url: https://github.com/argmaxinc/argmax-oss-swift.git
    exactVersion: 1.1.1
targets:
  FarFlowMediaBridge:
    type: framework
    platform: macOS
    sources: [FarFlowMediaBridge]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.faraz.farflow.media
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - sdk: Foundation.framework
  FarFlowCore:
    type: framework
    platform: macOS
    sources: [FarFlowCore]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.faraz.farflow.core
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - package: FluidAudio
      - package: MLXLanguageModels
        product: MLXLLM
      - package: MLXLanguageModels
        product: MLXLMCommon
      - sdk: libsqlite3.tbd
  FarFlow:
    type: application
    platform: macOS
    sources: [FarFlow]
    info:
      path: FarFlow/Info.plist
      properties:
        CFBundleDisplayName: Far Flow
        CFBundleName: Far Flow
        CFBundleShortVersionString: 0.2.0
        CFBundleVersion: '2'
        NSMicrophoneUsageDescription: Far Flow uses your microphone only while you dictate. Speech is processed on this Mac.
        NSPrincipalClass: NSApplication
        NSHighResolutionCapable: true
        LSApplicationCategoryType: public.app-category.productivity
        NSSupportsAutomaticTermination: false
    entitlements:
      path: FarFlow/FarFlow.entitlements
      properties:
        com.apple.security.device.audio-input: true
    settings:
      base:
        PRODUCT_NAME: Far Flow
        PRODUCT_BUNDLE_IDENTIFIER: com.faraz.farflow
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIconStudio
        LD_RUNPATH_SEARCH_PATHS: '$(inherited) @executable_path/../Frameworks'
    dependencies:
      - target: FarFlowCore
        embed: true
      - target: FarFlowMediaBridge
        embed: true
        link: false
  FarFlowBench:
    type: tool
    platform: macOS
    sources: [FarFlowBench]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.faraz.farflow.bench
        LD_RUNPATH_SEARCH_PATHS: '$(inherited) @executable_path'
    dependencies:
      - target: FarFlowCore
      - package: WhisperKit
  FarFlowTests:
    type: bundle.unit-test
    platform: macOS
    sources: [FarFlowTests, FarFlow/App/MediaPlaybackService.swift]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        ENABLE_HARDENED_RUNTIME: NO
    dependencies:
      - target: FarFlowCore
  FarFlowUITests:
    type: bundle.ui-testing
    platform: macOS
    sources: [FarFlowUITests]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        ENABLE_HARDENED_RUNTIME: NO
    dependencies:
      - target: FarFlow
schemes:
  FarFlow:
    build:
      targets:
        FarFlow: all
    test:
      targets: [FarFlowTests, FarFlowUITests]
  FarFlowBench:
    build:
      targets:
        FarFlowBench: all
